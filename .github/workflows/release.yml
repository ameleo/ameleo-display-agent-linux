name: Release

# A tag v<version> builds the agent's RPM and source RPM for Fedora and publishes them in a
# GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  rpm:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 45
    steps:
      - name: Build dependencies
        # Git first: the checkout is then a repository, which `make rpm` archives.
        run: dnf install -y git make rpm-build cargo rust clang pipewire-devel systemd-rpm-macros
      - uses: actions/checkout@v7
      - name: The tag is the crate's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, crate $version"; exit 1; }
      - name: RPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make rpm
          mkdir dist
          cp target/rpm/RPMS/x86_64/*.rpm target/rpm/SRPMS/*.rpm dist/
      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: dist/*.rpm
          if-no-files-found: error

  publish:
    needs: rpm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: rpm
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes: the version's section of CHANGELOG.md, which must have one.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$1 == "##" && $2 == v {on = 1; next} $1 == "##" {on = 0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no section for $version in CHANGELOG.md"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md ./*.rpm
